name: Build and validate website

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "posts/**"
      - "scripts/**"
      - "data/youtube-shorts.json"
      - "data/*-pages.mjs"
      - "data/interactive-modules.mjs"
      - "unternehmen/**"
      - "quiz-games/**"
      - "ueber-swissploit/**"
      - "leistungen/**"
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-posts.yml"

permissions:
  contents: read

concurrency:
  group: build-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build posts
        run: npm run build
      - name: Test and check technical SEO
        run: |
          npm run check:headers
          npm test
          npm run check:seo
