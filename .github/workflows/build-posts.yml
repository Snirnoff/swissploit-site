name: Build blog posts

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "posts/**"
      - "scripts/**"
      - "data/youtube-shorts.json"
      - "leistungen/**"
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-posts.yml"

permissions:
  contents: write

concurrency:
  group: build-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build posts
        run: npm run build
      - name: Test and check technical SEO
        run: |
          npm run check:headers
          npm test
          npm run check:seo
      - name: Commit generated pages
        run: |
          git add assets/blog-posts.js sitemap.xml blog/ en/blog/ learn/ en/learn/ index.html leistungen/ phishing-simulation/index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-build Learn pages and sitemap"
            git push
          else
            echo "No changes to commit."
          fi
