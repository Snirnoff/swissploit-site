<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Swissploit Learn Redirect</title>
  <meta name="robots" content="noindex,follow" />
  <meta name="description" content="Legacy redirect page for Swissploit Learn." />
  <meta http-equiv="refresh" content="0; url=/learn/" />
  <link rel="canonical" href="https://swissploit.ch/learn/" />
  <script>
    (function () {
      const savedLang = localStorage.getItem("swissploit-blog-lang");
      const target = savedLang === "en" ? "/en/learn/" : "/learn/";
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font: 16px/1.5 Inter, system-ui, sans-serif;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 680px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Weiterleitung…</h1>
    <p>Der Wissensbereich ist neu unter Learn erreichbar.</p>
    <p><a href="/learn/">Zu Learn</a></p>
  </main>
</body>
</html>
